[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-cost-kit"
version = "0.2.5"
description = "Generate cost-saving Claude Code settings, CLAUDE.md, subagents, hooks and usage reports inside a repo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cckit = "cckit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cckit = ["assets/*", "assets/usage_app/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:This process .* is multi-threaded:DeprecationWarning"]
